name: fynona_api
description: "Fynona public API client: models generated from api/openapi.yaml and the resilient transport."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0

dependencies:
  dio: ^5.9.0

dev_dependencies:
  lints: ^6.0.0
  swagger_parser: 2.4.0
  test: ^1.26.0

swagger_parser:
  schema_path: ../../api/openapi.yaml
  output_directory: lib/src/gen
  generation:
    root_api_class_name: FynonaApi
    http_client: dio
    serializer: plain
    unknown_enum_values: preserve
    unknown_discriminator_values: preserve
    type_mappings:
      - type: string
        format: decimal
        dart_type: WireDecimal
        import: package:fynona_api/src/decimal.dart
        codec:
          import: package:fynona_api/src/decimal.dart
          from_json: wireDecimalFromJson
          to_json: wireDecimalToJson
