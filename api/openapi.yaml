openapi: 3.1.0
info:
  title: Fynona public API
  version: 1.0.0
  description: |
    Public API of the Fynona server (API-1: this file is the source of truth;
    server types and handler interfaces are generated from it, ADR-001).

    Conventions: JSON in UTF-8, snake_case fields (API-4); money, quantities,
    rates and prices are decimal strings, never JSON numbers (API-5, DOM-11);
    every error is an RFC 9457 problem with a stable `code` (API-30); every
    response carries `X-Request-ID` (API-21); `/v1` routes are rate limited
    (API-24) and mutating requests need `Idempotency-Key` (API-20).

    Versioning (API-12): `info.version` is the contract version (SemVer).
    Clients read `contract_version` and `min_contract_version` from
    `GET /v1/meta` and send the contract version they were built against in
    `X-Fynona-API`; another major or a version below the minimum gets `426`.
servers:
  - url: /
    description: Same origin; the host depends on the environment (PLT-24).
tags:
  - name: meta
    description: Server, API and client compatibility information.
paths:
  /v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Server version, contract versions, environment and feature flags (API-12).
      description: |
        A client is compatible when its contract version has the major of
        `contract_version` and is not below `min_contract_version`. This route
        never checks `X-Fynona-API`, so an outdated client can always read it.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XFynonaAPI'
      responses:
        '200':
          description: Server metadata.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            RateLimit-Policy: {$ref: '#/components/headers/RateLimitPolicy'}
            RateLimit: {$ref: '#/components/headers/RateLimit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Meta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/openapi.json:
    get:
      operationId: getOpenAPI
      tags: [meta]
      summary: This specification as JSON (API-3).
      description: Never checks `X-Fynona-API`, like `GET /v1/meta`.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XFynonaAPI'
      responses:
        '200':
          description: The public OpenAPI document.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            RateLimit-Policy: {$ref: '#/components/headers/RateLimitPolicy'}
            RateLimit: {$ref: '#/components/headers/RateLimit'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Problem'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 generated by the client and repeated unchanged on retry. Required
        on POST, PUT, PATCH and DELETE except explicitly marked pure calculations.
        A replay returns the stored response with `Idempotent-Replayed: true`;
        the same key with another request is `422`, a key still in progress `409` (API-20).
      schema: {type: string, minLength: 1, maxLength: 255}
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Trace id; the server generates one when absent or invalid (API-21).
      schema: {type: string}
    XFynonaAPI:
      name: X-Fynona-API
      in: header
      required: false
      description: |
        Contract version (SemVer `info.version`) the client was built against
        (API-12). Absent passes. Not SemVer is `400`; another major than the
        served `contract_version` or a version below `min_contract_version` is
        `426` with code `api_version_unsupported`. A newer version of the same
        major passes. `GET /v1/meta` and `GET /v1/openapi.json` ignore it.
      schema: {type: string, examples: ['1.0.0']}
  headers:
    XRequestId:
      description: Trace id echoed or generated by the server (API-21).
      schema: {type: string}
    IdempotentReplayed:
      description: Present with value `true` when the response is a stored replay (API-20).
      schema: {type: string, enum: ['true']}
    RateLimitPolicy:
      description: 'Quota policy, e.g. `"api";q=60;w=60` (API-24, IETF RateLimit headers).'
      schema: {type: string}
    RateLimit:
      description: 'Remaining quota, e.g. `"api";r=59;t=42` (API-24).'
      schema: {type: string}
    RetryAfter:
      description: Seconds to wait before retrying (API-24).
      schema: {type: integer, minimum: 0}
  responses:
    Problem:
      description: RFC 9457 problem details (API-30).
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BadRequest:
      description: The request does not match this specification; `errors[]` names the fields (code `request.invalid`).
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UpgradeRequired:
      description: The contract version declared in `X-Fynona-API` is of another major or below `min_contract_version` (code `api_version_unsupported`, API-12); `detail` names both versions, `update_url` links to a supported client.
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Rate limit exceeded (code `rate_limited`, API-24).
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        RateLimit-Policy: {$ref: '#/components/headers/RateLimitPolicy'}
        RateLimit: {$ref: '#/components/headers/RateLimit'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Decimal:
      type: string
      format: decimal
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Decimal number as a string with the commodity's scale; never a JSON number, never an exponent (API-5, DOM-11).
      examples: ['-100.00']
    Money:
      type: object
      required: [amount, currency]
      description: An amount of a commodity (API-5).
      properties:
        amount: {$ref: '#/components/schemas/Decimal'}
        currency:
          type: string
          description: ISO 4217 code or asset ticker.
          examples: [UAH]
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      description: RFC 9457 problem details with the Fynona extensions `code`, `request_id`, `errors` and `update_url` (API-30). Clients branch on `code`, never on text.
      properties:
        type:
          type: string
          format: uri-reference
          description: '`urn:fynona:problem:<code>`.'
        title:
          type: string
          description: Localized by Accept-Language (uk, ru, en; API-25).
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: Stable machine code such as `not_found`, `rate_limited`, `request.invalid`.
        request_id: {type: string}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        update_url:
          type: string
          format: uri
          description: Where to get a supported client; set on `api_version_unsupported`.
    FieldError:
      type: object
      required: [field, code, detail]
      properties:
        field:
          type: string
          description: Parameter name or JSON Pointer into the request body.
        code: {type: string}
        detail: {type: string}
    Environment:
      type: string
      enum: [local, sandbox, production]
      description: Deployment environment (PLT-24).
    Meta:
      type: object
      required: [server_version, api_version, contract_version, min_contract_version, environment, features, update_url]
      properties:
        server_version:
          type: string
          description: Semantic version of the server build (PLT-10).
          examples: [1.4.0]
        api_version:
          type: string
          description: Major API version (API-10).
          examples: [v1]
        contract_version:
          type: string
          description: SemVer of the served contract, this document's `info.version` (API-12).
          examples: [1.0.0]
        min_contract_version:
          type: string
          description: Lowest contract version accepted in `X-Fynona-API`; same major as `contract_version` (API-12).
          examples: [1.0.0]
        environment: {$ref: '#/components/schemas/Environment'}
        features:
          type: object
          description: Feature flags by name; unknown flags must be ignored.
          additionalProperties: {type: boolean}
        update_url:
          type: string
          format: uri
          description: Where to get a supported client.
