name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Flutter (ADR-002); local development uses the same version.
  FLUTTER_VERSION: 3.50.0

jobs:
  checks:
    name: Format, analyze, tests (incl. goldens and work zone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependencies
        run: |
          flutter pub get
          flutter pub get --directory packages/fynona_ui
          dart pub get --directory packages/fynona_api
      - name: Generated API models are up to date (swagger_parser, ADR-001)
        working-directory: packages/fynona_api
        run: |
          dart run swagger_parser
          git diff --exit-code -- lib/src/gen
          test -z "$(git status --porcelain -- lib/src/gen)"
      - name: Generated tokens are up to date
        working-directory: packages/fynona_ui
        run: |
          dart run tool/gen_tokens.dart
          git diff --exit-code -- lib/src/tokens/tokens.g.dart
      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/gen
      - name: Format
        run: dart format --set-exit-if-changed .
      - name: Analyze app
        run: flutter analyze
      - name: Analyze fynona_ui
        working-directory: packages/fynona_ui
        run: flutter analyze
      - name: Analyze fynona_api
        working-directory: packages/fynona_api
        run: dart analyze
      - name: Test fynona_api (the e2e is skipped without FYNONA_API_URL)
        working-directory: packages/fynona_api
        run: dart test
      - name: Test fynona_ui
        working-directory: packages/fynona_ui
        run: flutter test
      - name: Test app (work zone, semantics, l10n, glass, goldens)
        run: flutter test
      - name: Golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug APK)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --debug

  build-web:
    name: Build web
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build web

  build-linux:
    name: Build Linux
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux

  build-ios:
    name: Build iOS (no codesign)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --no-codesign

  build-macos:
    name: Build macOS
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos

  build-windows:
    name: Build Windows
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows
